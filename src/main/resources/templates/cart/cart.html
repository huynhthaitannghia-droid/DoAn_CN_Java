<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">
    <h4 class="fw-bold mb-4">🛒 Giỏ hàng</h4>

    <div th:if="${cartItems.isEmpty()}" class="text-center py-5">
        <p class="text-muted fs-5">Giỏ hàng trống 😔</p>
        <a th:href="@{/products}" class="btn btn-warning">Mua sắm ngay</a>
    </div>

    <div th:if="${!cartItems.isEmpty()}" class="row g-4">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Sản phẩm</th>
                            <th class="text-center">Số lượng</th>
                            <th class="text-end">Thành tiền</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <img th:src="${item.thumbnail}"
                                         style="width:60px;height:60px;object-fit:cover"
                                         class="rounded"
                                         onerror="this.src='/images/default.png'" alt="">
                                    <div>
                                        <p class="mb-0 fw-bold"
                                           th:text="${item.productName}"></p>
                                        <small class="text-muted"
                                               th:text="${#numbers.formatDecimal(item.price,0,'COMMA',0,'POINT')} + 'đ'">
                                        </small>
                                    </div>
                                </div>
                            </td>
                            <td class="text-center" style="width:160px">
                                <form th:action="@{/cart/update}" method="post"
                                      class="d-flex justify-content-center">
                                    <input type="hidden" name="productId"
                                           th:value="${item.productId}">
                                    <div class="input-group input-group-sm"
                                         style="width:120px">
                                        <button type="submit" name="quantity"
                                                th:value="${item.quantity - 1}"
                                                class="btn btn-outline-secondary">−</button>
                                        <input type="text" class="form-control text-center"
                                               th:value="${item.quantity}" readonly>
                                        <button type="submit" name="quantity"
                                                th:value="${item.quantity + 1}"
                                                class="btn btn-outline-secondary">+</button>
                                    </div>
                                </form>
                            </td>
                            <td class="text-end fw-bold text-danger"
                                th:text="${#numbers.formatDecimal(item.subtotal,0,'COMMA',0,'POINT')} + 'đ'">
                            </td>
                            <td>
                                <form th:action="@{/cart/remove}" method="post">
                                    <input type="hidden" name="productId"
                                           th:value="${item.productId}">
                                    <button class="btn btn-sm btn-outline-danger">✕</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Tóm tắt -->
        <div class="col-md-4">
            <div class="card shadow-sm p-3">
                <h6 class="fw-bold mb-3">Tóm tắt đơn hàng</h6>
                <div class="d-flex justify-content-between mb-2">
                    <span>Tạm tính</span>
                    <span th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + 'đ'">
                    </span>
                </div>
                <hr>
                <div class="d-flex justify-content-between fw-bold fs-5">
                    <span>Tổng cộng</span>
                    <span class="text-danger"
                          th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + 'đ'">
                    </span>
                </div>
                <a th:href="@{/checkout}"
                   class="btn btn-warning w-100 mt-3 fw-bold">
                    Tiến hành thanh toán →
                </a>
                <a th:href="@{/products}"
                   class="btn btn-outline-secondary w-100 mt-2">
                    ← Tiếp tục mua sắm
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
