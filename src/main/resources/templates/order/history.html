<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đơn hàng của tôi</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">
    <h4 class="fw-bold mb-4">📦 Đơn hàng của tôi</h4>

    <div th:if="${orders.isEmpty()}" class="text-center py-5 text-muted">
        Bạn chưa có đơn hàng nào.
    </div>

    <div class="card shadow-sm" th:if="${!orders.isEmpty()}">
        <table class="table mb-0 align-middle">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Ngày đặt</th>
                <th>Tổng tiền</th>
                <th>Trạng thái</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="'#' + ${o.id}"></td>
                <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="fw-bold text-danger"
                    th:text="${#numbers.formatDecimal(o.finalPrice,0,'COMMA',0,'POINT')} + 'đ'">
                </td>
                <td>
                        <span th:classappend="${
                            o.status.name() == 'PENDING' ? 'badge bg-warning text-dark' :
                            o.status.name() == 'CONFIRMED' ? 'badge bg-info text-dark' :
                            o.status.name() == 'SHIPPING' ? 'badge bg-primary' :
                            o.status.name() == 'COMPLETED' ? 'badge bg-success' :
                            'badge bg-danger'}"
                              th:text="${o.status.description}"></span>
                </td>
                <td>
                    <a th:href="@{/orders/{id}(id=${o.id})}"
                       class="btn btn-sm btn-outline-dark">Chi tiết</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
