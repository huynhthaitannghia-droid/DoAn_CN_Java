<!-- ════════════════════════════════════════════════════
     templates/error/403.html  — Trang không có quyền
     ════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>403 — Không có quyền truy cập</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background: #f8f9fa; }
        .error-box {
          max-width: 480px; margin: 10vh auto;
          background: #fff; border-radius: 16px;
          padding: 3rem 2.5rem; text-align: center;
          box-shadow: 0 4px 24px rgba(0,0,0,.07);
        }
        .error-code { font-size: 5rem; font-weight: 800;
                      color: #dc3545; line-height: 1; }
        .error-icon { font-size: 3.5rem; color: #ffc107; }
    </style>
</head>
<body>
<div class="error-box">
    <div class="error-icon mb-3"><i class="bi bi-shield-lock"></i></div>
    <div class="error-code">403</div>
    <h4 class="mt-2 mb-1">Không có quyền truy cập</h4>
    <p class="text-muted mb-4">
        Bạn không được phép xem trang này.<br>
        Vui lòng đăng nhập bằng tài khoản có đủ quyền.
    </p>
    <a href="/" class="btn btn-primary me-2"><i class="bi bi-house me-1"></i>Trang chủ</a>
    <a href="/auth/login" class="btn btn-outline-secondary">
        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
    </a>
</div>
</body>
</html>
