<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý sản phẩm — Cafe Admin</title>
    <th:block th:replace="~{fragments/admin-layout :: adminHead}"/>
</head>
<body>
<th:block th:replace="~{fragments/admin-layout :: sidebar}"/>
<th:block th:replace="~{fragments/admin-layout :: topbar('Quản lý sản phẩm')}"/>
<th:block th:replace="~{fragments/admin-layout :: flashMessages}"/>

<main id="main-content">
    <!-- Filter bar -->
    <div class="admin-table p-3 mb-3 d-flex flex-wrap gap-2 align-items-center">
        <form th:action="@{/admin/products}" method="get"
              class="d-flex flex-wrap gap-2 flex-grow-1">
            <input type="text" name="keyword" class="form-control form-control-sm" style="width:220px"
                   placeholder="Tìm tên sản phẩm…" th:value="${keyword}"/>
            <select name="categoryId" class="form-select form-select-sm" style="width:180px">
                <option value="">Tất cả danh mục</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${categoryId != null and categoryId == c.id}"></option>
            </select>
            <button class="btn btn-sm btn-primary" type="submit">
                <i class="bi bi-search me-1"></i>Lọc
            </button>
            <a th:href="@{/admin/products}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-x-circle me-1"></i>Xóa lọc
            </a>
        </form>
        <a th:href="@{/admin/products/create}" class="btn btn-sm btn-success ms-auto">
            <i class="bi bi-plus-lg me-1"></i>Thêm sản phẩm
        </a>
    </div>

    <!-- Table -->
    <div class="admin-table">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th style="width:60px">Ảnh</th>
                    <th>Tên sản phẩm</th>
                    <th>Danh mục</th>
                    <th>Giá</th>
                    <th>Tồn kho</th>
                    <th>Trạng thái</th>
                    <th style="width:140px">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products.content}">
                    <td>
                        <img th:src="${p.primaryImageUrl ?: '/images/no-image.png'}"
                             alt="" class="rounded" style="width:46px;height:46px;object-fit:cover"/>
                    </td>
                    <td>
                        <div class="fw-500" th:text="${p.name}"></div>
                        <small class="text-muted" th:text="'ID: ' + ${p.id}"></small>
                    </td>
                    <td th:text="${p.category?.name ?: '—'}"></td>
                    <td>
              <span th:if="${p.salePrice != null and p.salePrice < p.price}" class="text-danger fw-500"
                    th:text="${#numbers.formatDecimal(p.salePrice,0,'COMMA',0,'POINT') + '₫'}"></span>
                        <span th:class="${p.salePrice != null and p.salePrice < p.price} ? 'text-muted text-decoration-line-through small' : 'fw-500'"
                              th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT') + '₫'}"></span>
                    </td>
                    <td>
                        <span th:class="${p.stock < 10} ? 'text-danger fw-600' : ''" th:text="${p.stock}"></span>
                        <small th:if="${p.stock < 10}" class="text-danger"> ⚠</small>
                    </td>
                    <td>
                        <form th:action="@{/admin/products/{id}/toggle(id=${p.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm border-0 p-0" title="Bật/tắt">
                                <span th:if="${p.active}" class="badge bg-success">Đang bán</span>
                                <span th:unless="${p.active}" class="badge bg-secondary">Tạm dừng</span>
                            </button>
                        </form>
                    </td>
                    <td>
                        <a th:href="@{/admin/products/{id}/edit(id=${p.id})}"
                           class="btn btn-sm btn-outline-primary me-1" title="Sửa">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <button type="button" class="btn btn-sm btn-outline-danger"
                                title="Xóa"
                                data-bs-toggle="modal" data-bs-target="#deleteModal"
                                th:data-id="${p.id}" th:data-name="${p.name}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                <tr th:if="${products.totalElements == 0}">
                    <td colspan="7" class="text-center text-muted py-4">
                        <i class="bi bi-box-seam display-6 d-block mb-2 text-muted opacity-50"></i>
                        Không có sản phẩm nào
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${products.totalPages > 1}"
             class="d-flex justify-content-between align-items-center p-3 border-top">
            <small class="text-muted"
                   th:text="'Trang ' + (${currentPage}+1) + '/' + ${products.totalPages} + ' — ' + ${products.totalElements} + ' sản phẩm'"></small>
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/products(keyword=${keyword},categoryId=${categoryId},page=${currentPage-1})}">‹</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages-1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/admin/products(keyword=${keyword},categoryId=${categoryId},page=${i})}"
                           th:text="${i+1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage+1 == products.totalPages} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/products(keyword=${keyword},categoryId=${categoryId},page=${currentPage+1})}">›</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">Xác nhận xóa</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body small">
                Bạn có chắc muốn xóa sản phẩm <strong id="deleteProductName"></strong>?
            </div>
            <div class="modal-footer">
                <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <form id="deleteForm" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-sm btn-danger">Xóa</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('deleteModal').addEventListener('show.bs.modal', e => {
      const btn = e.relatedTarget;
      document.getElementById('deleteProductName').textContent = btn.dataset.name;
      document.getElementById('deleteForm').action = `/admin/products/${btn.dataset.id}/delete`;
    });
    document.querySelectorAll('.toast').forEach(t => setTimeout(() => t.classList.remove('show'), 3000));
</script>
</body>
</html>
