<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý đánh giá — Cafe Admin</title>
    <th:block th:replace="~{fragments/admin-layout :: adminHead}"/>
    <style>
        .reply-text { font-style: italic; color: #555; font-size: .85rem; }
        .reply-badge { font-size: .7rem; }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/admin-layout :: sidebar}"/>
<th:block th:replace="~{fragments/admin-layout :: topbar('Quản lý đánh giá')}"/>
<th:block th:replace="~{fragments/admin-layout :: flashMessages}"/>

<main id="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">Quản lý đánh giá</h4>
        <span class="text-muted small">
            <i class="bi bi-info-circle me-1"></i>
            Xóa đánh giá nếu phát hiện ngôn từ không phù hợp
        </span>
    </div>

    <div class="admin-table">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>Người dùng</th>
                <th>Sản phẩm</th>
                <th>Sao</th>
                <th>Nội dung / Phản hồi</th>
                <th>Ngày</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(reviews)}">
                <td colspan="7" class="text-center text-muted py-4">Chưa có đánh giá nào.</td>
            </tr>

            <tr th:each="review, stat : ${reviews}">
                <td th:text="${stat.count}"></td>

                <!-- Người dùng -->
                <td>
                    <div class="fw-semibold" th:text="${review.user.fullName}"></div>
                    <small class="text-muted" th:text="${review.user.email}"></small>
                </td>

                <!-- Sản phẩm -->
                <td>
                    <a th:href="@{/products/{id}(id=${review.product.id})}"
                       target="_blank" class="text-decoration-none"
                       th:text="${review.product.name}"></a>
                </td>

                <!-- Số sao — FIX: dùng th:if để tránh sequence(6,5) render ngược -->
                <td>
                    <div class="d-inline-flex text-warning">
                        <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                            <span th:classappend="${i <= review.rating} ? '' : 'text-secondary'">★</span>
                        </th:block>
                    </div>
                    <small class="text-muted ms-1" th:text="${review.rating} + '/5'"></small>
                </td>

                <!-- Nội dung + phản hồi -->
                <td style="max-width: 260px;">
                    <p class="mb-1 text-truncate" th:text="${review.comment}"
                       style="max-width:260px" th:title="${review.comment}"></p>
                    <div th:if="${review.adminReply != null and !#strings.isEmpty(review.adminReply)}"
                         class="border-start border-warning ps-2 mt-1">
                        <span class="badge bg-warning text-dark reply-badge me-1">Admin</span>
                        <span class="reply-text" th:text="${review.adminReply}"></span>
                    </div>
                </td>

                <!-- Ngày tạo -->
                <td>
                    <small th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                </td>

                <!-- Thao tác: Phản hồi + Xóa -->
                <td>
                    <div class="d-flex flex-wrap gap-1">
                        <!-- Phản hồi -->
                        <button type="button" class="btn btn-sm btn-outline-primary"
                                title="Phản hồi đánh giá"
                                th:data-id="${review.id}"
                                th:data-reply="${review.adminReply}"
                                onclick="openReplyModal(this)">
                            <i class="bi bi-reply"></i> Phản hồi
                        </button>

                        <!-- Xóa -->
                        <form th:action="@{/admin/reviews/{id}/delete(id=${review.id})}" method="post"
                              onsubmit="return confirm('Xác nhận xóa đánh giá này?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger" title="Xóa đánh giá">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Modal phản hồi đánh giá -->
<div class="modal fade" id="replyModal" tabindex="-1" aria-labelledby="replyModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="replyModalLabel"><i class="bi bi-reply me-2"></i>Phản hồi đánh giá</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="replyForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" id="csrfInput"/>
                <div class="modal-body">
                    <label for="adminReply" class="form-label fw-semibold">Nội dung phản hồi</label>
                    <textarea id="adminReply" name="adminReply" class="form-control" rows="4"
                              placeholder="Nhập phản hồi của bạn..." maxlength="500"></textarea>
                    <div class="form-text text-muted mt-1">Phản hồi sẽ hiển thị công khai bên dưới đánh giá.</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send me-1"></i>Lưu phản hồi
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function openReplyModal(btn) {
        const id = btn.dataset.id;
        const existing = btn.dataset.reply || '';
        document.getElementById('replyForm').action = '/admin/reviews/' + id + '/reply';
        document.getElementById('adminReply').value = existing;
        new bootstrap.Modal(document.getElementById('replyModal')).show();
    }
</script>
</body>
</html>
