<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh mục — Cafe Admin</title>
    <th:block th:replace="~{fragments/admin-layout :: adminHead}"/>
</head>
<body>
<th:block th:replace="~{fragments/admin-layout :: sidebar}"/>
<th:block th:replace="~{fragments/admin-layout :: topbar('Quản lý danh mục')}"/>
<th:block th:replace="~{fragments/admin-layout :: flashMessages}"/>

<main id="main-content">
    <div class="row g-3">
        <!-- Danh sách -->
        <div class="col-lg-8">
            <div class="admin-table">
                <div class="p-3 border-bottom fw-600">
                    <i class="bi bi-tags me-2 text-muted"></i>Danh sách danh mục
                </div>
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Tên danh mục</th>
                        <th>Slug</th>
                        <th>Số SP</th>
                        <th style="width:120px">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cat,iter : ${categories}">
                        <td class="text-muted small" th:text="${iter.index+1}"></td>
                        <td>
                            <span class="fw-500" th:text="${cat.name}"></span>
                        </td>
                        <td><code class="small" th:text="${cat.slug}"></code></td>
                        <td>
                <span class="badge bg-light text-dark border"
                      th:text="${cat.productCount ?: 0} + ' SP'"></span>
                        </td>
                        <td>
                            <a th:href="@{/admin/categories/{id}/edit(id=${cat.id})}"
                               class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a>
                            <button class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal" data-bs-target="#deleteCatModal"
                                    th:data-id="${cat.id}" th:data-name="${cat.name}"
                                    th:disabled="${cat.productCount != null and cat.productCount > 0}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="5" class="text-center text-muted py-4">Chưa có danh mục nào</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Form thêm mới -->
        <div class="col-lg-4">
            <div class="admin-table p-4">
                <h6 class="fw-600 mb-3"><i class="bi bi-plus-circle me-2"></i>Thêm danh mục mới</h6>
                <form th:action="@{/admin/categories/create}" method="post" th:object="${newCategory}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label fw-500">Tên danh mục <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="VD: Cà phê, Trà sữa…"/>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-500">Slug</label>
                        <input type="text" class="form-control" th:field="*{slug}"
                               placeholder="VD: ca-phe (tự sinh nếu để trống)"/>
                        <div class="form-text">URL-friendly, chỉ chữ thường và dấu gạch ngang</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-500">Mô tả</label>
                        <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-500">Thứ tự hiển thị</label>
                        <input type="number" class="form-control" th:field="*{sortOrder}" min="0" value="0"/>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-plus-lg me-1"></i>Thêm danh mục
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<!-- Delete modal -->
<div class="modal fade" id="deleteCatModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">Xóa danh mục</h6>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body small">
                Xóa danh mục <strong id="catName"></strong>?<br>
                <span class="text-danger">Hành động này không thể hoàn tác.</span>
            </div>
            <div class="modal-footer">
                <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <form id="deleteCatForm" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-sm btn-danger">Xóa</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('deleteCatModal').addEventListener('show.bs.modal', e => {
      const btn = e.relatedTarget;
      document.getElementById('catName').textContent = btn.dataset.name;
      document.getElementById('deleteCatForm').action = `/admin/categories/${btn.dataset.id}/delete`;
    });
    document.querySelectorAll('.toast').forEach(t => setTimeout(() => t.classList.remove('show'), 3000));

    // Auto-generate slug
    document.querySelector('[th\\:field="*{name}"]')?.addEventListener('input', function() {
      const slug = this.value.toLowerCase()
        .replace(/[àáâãäå]/g,'a').replace(/[èéêë]/g,'e').replace(/[ìíîï]/g,'i')
        .replace(/[òóôõö]/g,'o').replace(/[ùúûü]/g,'u').replace(/[ý]/g,'y')
        .replace(/đ/g,'d').replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-');
      const slugField = document.querySelector('[th\\:field="*{slug}"]');
      if (slugField && !slugField.value) slugField.value = slug;
    });
</script>
</body>
</html>
