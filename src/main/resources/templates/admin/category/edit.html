<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sửa danh mục — Cafe Admin</title>
    <th:block th:replace="~{fragments/admin-layout :: adminHead}"/>
</head>
<body>
<th:block th:replace="~{fragments/admin-layout :: sidebar}"/>
<th:block th:replace="~{fragments/admin-layout :: topbar('Sửa danh mục')}"/>

<main id="main-content">
    <div class="mb-3">
        <a th:href="@{/admin/categories}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Quay lại
        </a>
    </div>
    <div class="admin-table p-4" style="max-width:500px">
        <h6 class="fw-600 mb-3">Sửa danh mục</h6>
        <form th:action="@{/admin/categories/{id}/edit(id=${category.id})}"
              method="post" th:object="${category}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label fw-500">Tên danh mục <span class="text-danger">*</span></label>
                <input type="text" class="form-control" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-500">Slug</label>
                <input type="text" class="form-control" th:field="*{slug}"/>
            </div>
            <div class="mb-3">
                <label class="form-label fw-500">Mô tả</label>
                <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
            </div>
            <div class="mb-4">
                <label class="form-label fw-500">Thứ tự hiển thị</label>
                <input type="number" class="form-control" th:field="*{sortOrder}" min="0"/>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>Lưu thay đổi
                </button>
                <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Hủy</a>
            </div>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
