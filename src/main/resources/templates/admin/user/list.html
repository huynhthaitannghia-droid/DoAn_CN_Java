<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Người dùng — Cafe Admin</title>
    <th:block th:replace="~{fragments/admin-layout :: adminHead}"/>
</head>
<body>
<th:block th:replace="~{fragments/admin-layout :: sidebar}"/>
<th:block th:replace="~{fragments/admin-layout :: topbar('Quản lý người dùng')}"/>
<th:block th:replace="~{fragments/admin-layout :: flashMessages}"/>

<main id="main-content">
    <div class="admin-table p-3 mb-3">
        <form th:action="@{/admin/users}" method="get" class="d-flex gap-2 align-items-center">
            <input type="text" name="keyword" class="form-control form-control-sm" style="width:260px"
                   placeholder="Tìm username, email, SĐT…" th:value="${keyword}"/>
            <button class="btn btn-sm btn-primary"><i class="bi bi-search"></i></button>
            <a th:href="@{/admin/users}" class="btn btn-sm btn-outline-secondary">Xóa lọc</a>
        </form>
    </div>

    <div class="admin-table">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Người dùng</th>
                    <th>Email</th>
                    <th>SĐT</th>
                    <th>Quyền</th>
                    <th>Ngày đăng ký</th>
                    <th>Trạng thái</th>
                    <th style="width:100px">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users.content}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="admin-avatar" style="width:32px;height:32px;font-size:.75rem"
                                 th:text="${#strings.substring(u.fullName,0,1).toUpperCase()}"></div>
                            <span class="fw-500" th:text="${u.fullName}"></span>
                        </div>
                    </td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.phone ?: '—'}"></td>
                    <td>
                        <span th:if="${u.role.name() == 'ADMIN'}" class="badge bg-danger">ADMIN</span>
                        <span th:unless="${u.role.name() == 'ADMIN'}" class="badge bg-light text-dark border">USER</span>
                    </td>
                    <td th:text="${#temporals.format(u.createdAt,'dd/MM/yyyy')}"></td>
                    <td>
                        <span th:if="${u.locked}" class="badge bg-warning text-dark">Bị khóa</span>
                        <span th:unless="${u.locked}" class="badge bg-success">Hoạt động</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/users/{id}/toggle-lock(id=${u.id})}"
                              method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${u.locked} ? 'btn-outline-success' : 'btn-outline-warning'"
                                    th:title="${u.locked} ? 'Mở khóa' : 'Khóa tài khoản'">
                                <i class="bi" th:classappend="${u.locked} ? 'bi-unlock' : 'bi-lock'"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${users.totalElements == 0}">
                    <td colspan="7" class="text-center text-muted py-4">Không tìm thấy người dùng</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${users.totalPages > 1}"
             class="d-flex justify-content-between align-items-center p-3 border-top">
            <small class="text-muted"
                   th:text="'Trang ' + (${currentPage}+1) + '/' + ${users.totalPages}"></small>
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(keyword=${keyword},page=${currentPage-1})}">‹</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0,users.totalPages-1)}"
                        th:classappend="${i==currentPage}?'active'">
                        <a class="page-link"
                           th:href="@{/admin/users(keyword=${keyword},page=${i})}" th:text="${i+1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage+1==users.totalPages}?'disabled'">
                        <a class="page-link" th:href="@{/admin/users(keyword=${keyword},page=${currentPage+1})}">›</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.toast').forEach(t => setTimeout(() => t.classList.remove('show'), 3000));
</script>
</body>
</html>
