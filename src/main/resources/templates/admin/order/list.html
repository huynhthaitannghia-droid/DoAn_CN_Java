<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý đơn hàng — Cafe Admin</title>
    <th:block th:replace="~{fragments/admin-layout :: adminHead}"/>
</head>
<body>
<th:block th:replace="~{fragments/admin-layout :: sidebar}"/>
<th:block th:replace="~{fragments/admin-layout :: topbar('Quản lý đơn hàng')}"/>
<th:block th:replace="~{fragments/admin-layout :: flashMessages}"/>

<main id="main-content">

    <!-- Filter -->
    <div class="admin-table p-3 mb-3">
        <form th:action="@{/admin/orders}" method="get" class="d-flex flex-wrap gap-2 align-items-center">
            <input type="text" name="keyword" class="form-control form-control-sm" style="width:220px"
                   placeholder="Mã ĐH, SĐT…" th:value="${keyword}"/>
            <div class="d-flex gap-1">
                <a th:href="@{/admin/orders}"
                   class="btn btn-sm" th:classappend="${status == ''} ? 'btn-dark' : 'btn-outline-secondary'">
                    Tất cả
                </a>
                <a th:each="s : ${statuses}"
                   th:href="@{/admin/orders(status=${s},keyword=${keyword})}"
                   class="btn btn-sm"
                   th:classappend="${status == s} ? 'btn-primary' : 'btn-outline-secondary'"
                   th:text="${s.description}"></a>
            </div>
            <button class="btn btn-sm btn-primary ms-auto" type="submit">
                <i class="bi bi-search me-1"></i>Tìm
            </button>
        </form>
    </div>

    <!-- Table -->
    <div class="admin-table">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Mã ĐH</th>
                    <th>Khách hàng</th>
                    <th>SĐT</th>
                    <th>Tổng tiền</th>
                    <th>Phương thức</th>
                    <th>Trạng thái</th>
                    <th>Ngày đặt</th>
                    <th style="width:80px"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders.content}">
                    <td class="fw-500" th:text="'#' + ${o.id}"></td>
                    <td th:text="${o.user.fullName}"></td>
                    <td th:text="${o.phone}"></td>
                    <td class="fw-500"
                        th:text="${#numbers.formatDecimal(o.finalPrice,0,'COMMA',0,'POINT') + '₫'}"></td>
                    <td>
              <span class="badge"
                    th:classappend="${o.paymentMethod == 'COD'} ? 'bg-secondary' : 'bg-info text-dark'"
                    th:text="${o.paymentMethod}"></span>
                    </td>
                    <td>
              <span class="badge rounded-pill"
                    th:classappend="'badge-' + ${o.status}"
                    th:text="${o.status.description}"></span>
                    </td>
                    <td th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <a th:href="@{/admin/orders/{id}(id=${o.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-eye"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${orders.totalElements == 0}">
                    <td colspan="8" class="text-center text-muted py-4">
                        <i class="bi bi-receipt display-6 d-block mb-2 opacity-50"></i>
                        Không tìm thấy đơn hàng nào
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${orders.totalPages > 1}"
             class="d-flex justify-content-between align-items-center p-3 border-top">
            <small class="text-muted"
                   th:text="'Trang ' + (${currentPage}+1) + '/' + ${orders.totalPages} + ' — ' + ${orders.totalElements} + ' đơn'"></small>
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/orders(keyword=${keyword},status=${status},page=${currentPage-1})}">‹</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, orders.totalPages-1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/admin/orders(keyword=${keyword},status=${status},page=${i})}"
                           th:text="${i+1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage+1 == orders.totalPages} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/orders(keyword=${keyword},status=${status},page=${currentPage+1})}">›</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.toast').forEach(t => setTimeout(() => t.classList.remove('show'), 3000));
</script>
</body>
</html>
