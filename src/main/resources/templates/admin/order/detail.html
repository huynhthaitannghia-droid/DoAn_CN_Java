<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Đơn hàng #' + ${order.id} + ' — Cafe Admin'">Chi tiết đơn hàng</title>
    <th:block th:replace="~{fragments/admin-layout :: adminHead}"/>
</head>
<body>
<th:block th:replace="~{fragments/admin-layout :: sidebar}"/>
<th:block th:replace="~{fragments/admin-layout :: topbar(|Đơn hàng #${order.id}|)}"/>
<th:block th:replace="~{fragments/admin-layout :: flashMessages}"/>

<main id="main-content">
    <div class="mb-3">
        <a th:href="@{/admin/orders}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Quay lại
        </a>
    </div>

    <div class="row g-3">
        <!-- ── Thông tin đơn hàng ── -->
        <div class="col-lg-8">
            <div class="admin-table p-4 mb-3">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <h6 class="fw-700 mb-0" th:text="'Đơn hàng #' + ${order.id}"></h6>
                        <small class="text-muted"
                               th:text="${#temporals.format(order.createdAt,'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                    <span class="badge rounded-pill fs-6 px-3 py-2"
                          th:classappend="'badge-' + ${order.status}"
                          th:text="${order.status.description}"></span>
                </div>

                <!-- Sản phẩm -->
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width:60px">Ảnh</th>
                        <th>Sản phẩm</th>
                        <th class="text-end">Đơn giá</th>
                        <th class="text-center">SL</th>
                        <th class="text-end">Thành tiền</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${order.items}">
                        <td>
                            <img th:src="${item.product?.primaryImageUrl ?: '/images/no-image.png'}"
                                 class="rounded" style="width:44px;height:44px;object-fit:cover"/>
                        </td>
                        <td th:text="${item.product.name}"></td>
                        <td class="text-end"
                            th:text="${#numbers.formatDecimal(item.unitPrice,0,'COMMA',0,'POINT') + '₫'}"></td>
                        <td class="text-center" th:text="${item.quantity}"></td>
                        <td class="text-end fw-500"
                            th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity,0,'COMMA',0,'POINT') + '₫'}"></td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <td colspan="4" class="text-end text-muted">Tạm tính:</td>
                        <td class="text-end"
                            th:text="${#numbers.formatDecimal(order.totalPrice,0,'COMMA',0,'POINT') + '₫'}"></td>
                    </tr>
                    <tr th:if="${order.discountAmount != null and order.discountAmount > 0}">
                        <td colspan="4" class="text-end text-success">Giảm giá (coupon):</td>
                        <td class="text-end text-success"
                            th:text="'- ' + ${#numbers.formatDecimal(order.discountAmount,0,'COMMA',0,'POINT') + '₫'}"></td>
                    </tr>
                    <tr>
                        <td colspan="4" class="text-end fw-700">Tổng cộng:</td>
                        <td class="text-end fw-700 text-primary fs-5"
                            th:text="${#numbers.formatDecimal(order.finalPrice,0,'COMMA',0,'POINT') + '₫'}"></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- ── Sidebar: khách hàng + cập nhật ── -->
        <div class="col-lg-4">
            <!-- Thông tin khách -->
            <div class="admin-table p-3 mb-3">
                <h6 class="fw-600 mb-3"><i class="bi bi-person me-2"></i>Thông tin khách hàng</h6>
                <dl class="row mb-0 small">
                    <dt class="col-5 text-muted">Họ tên</dt>
                    <dd class="col-7" th:text="${order.user.fullName}"></dd>
                    <dt class="col-5 text-muted">SĐT</dt>
                    <dd class="col-7" th:text="${order.phone}"></dd>
                    <dt class="col-5 text-muted">Địa chỉ</dt>
                    <dd class="col-7" th:text="${order.shippingAddress}"></dd>
                    <dt class="col-5 text-muted">Thanh toán</dt>
                    <dd class="col-7">
                        <span class="badge bg-secondary" 
                              th:text="${order.paymentMethod == T(com.huit.CN_Java.entity.Order$PaymentMethod).COD 
                              ? 'COD' : 'Chuyển khoản'}"></span>
                    </dd>
                    <dt th:if="${order.note != null}" class="col-5 text-muted">Ghi chú</dt>
                    <dd th:if="${order.note != null}" class="col-7 fst-italic" th:text="${order.note}"></dd>
                </dl>
            </div>

            <!-- Cập nhật trạng thái -->
            <div class="admin-table p-3">
                <h6 class="fw-600 mb-3"><i class="bi bi-arrow-repeat me-2"></i>Cập nhật trạng thái</h6>

                <!-- Chỉ hiện form nếu còn trạng thái hợp lệ để chuyển -->
                <th:block th:if="${not #lists.isEmpty(order.status.nextAllowed())}">
                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <select name="status" class="form-select form-select-sm">
                                <!-- Chỉ hiện các trạng thái được phép chuyển -->
                                <option th:each="s : ${order.status.nextAllowed()}"
                                        th:value="${s}"
                                        th:text="${s.description}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100">
                            <i class="bi bi-check-lg me-1"></i>Cập nhật
                        </button>
                    </form>
                </th:block>
                <th:block th:unless="${not #lists.isEmpty(order.status.nextAllowed())}">
                    <p class="text-muted small fst-italic mb-0">
                        Đơn hàng đã kết thúc, không thể thay đổi trạng thái.
                    </p>
                </th:block>

                <!-- Timeline trạng thái -->
                <div class="mt-3">
                    <div class="small text-muted mb-2">Tiến trình:</div>
                    <th:block th:with="flowStatuses=${ {T(com.huit.CN_Java.entity.Order$OrderStatus).PENDING,
                                                        T(com.huit.CN_Java.entity.Order$OrderStatus).CONFIRMED,
                                                        T(com.huit.CN_Java.entity.Order$OrderStatus).SHIPPING,
                                                        T(com.huit.CN_Java.entity.Order$OrderStatus).COMPLETED} },
                                        currentIdx=${order.statusIndex}">
                        <div th:each="s,iter : ${flowStatuses}"
                             class="d-flex align-items-center gap-2 mb-1">
                            <i class="bi small"
                               th:classappend="${order.status == s}    ? 'bi-record-circle-fill text-primary' :
                                               (${iter.index < currentIdx} ? 'bi-check-circle-fill text-success' :
                                                                              'bi-circle text-muted')"></i>
                            <span class="small"
                                  th:text="${s.description}"
                                  th:classappend="${order.status == s} ? 'fw-600 text-primary' : 'text-muted'"></span>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.toast').forEach(t => setTimeout(() => t.classList.remove('show'), 3000));
</script>
</body>
</html>
