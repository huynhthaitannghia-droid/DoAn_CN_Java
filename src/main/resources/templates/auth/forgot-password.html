<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="width: 420px">
        <h4 class="text-center mb-2">☕ Quên mật khẩu</h4>
        <p class="text-center text-muted small mb-4">
            Nhập email của bạn, chúng tôi sẽ gửi link đặt lại mật khẩu.
        </p>

        <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
        <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                       placeholder="example@email.com" required autofocus>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">
                Gửi link đặt lại mật khẩu
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            <a th:href="@{/login}">← Quay lại đăng nhập</a>
        </p>
    </div>
</div>
</body>
</html>
