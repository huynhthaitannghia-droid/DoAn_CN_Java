<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="width: 420px">
        <h4 class="text-center mb-2">☕ Đặt lại mật khẩu</h4>
        <p class="text-center text-muted small mb-4">Nhập mật khẩu mới cho tài khoản của bạn.</p>

        <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="mb-3">
                <label class="form-label">Mật khẩu mới</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Ít nhất 6 ký tự" required minlength="6" autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Xác nhận mật khẩu</label>
                <input type="password" name="confirmPassword" class="form-control"
                       placeholder="Nhập lại mật khẩu" required minlength="6">
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">
                Cập nhật mật khẩu
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            <a th:href="@{/login}">← Quay lại đăng nhập</a>
        </p>
    </div>
</div>
</body>
</html>
