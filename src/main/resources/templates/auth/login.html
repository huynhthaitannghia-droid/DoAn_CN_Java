<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="width: 420px">
        <h4 class="text-center mb-4">☕ Đăng nhập</h4>

        <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
        <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
        <div th:if="${logoutMsg}" class="alert alert-info" th:text="${logoutMsg}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                       placeholder="example@email.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="password" class="form-control"
                       placeholder="••••••" required>
            </div>
            <div class="mb-3 d-flex justify-content-between align-items-center">
                <div class="form-check">
                    <input type="checkbox" name="remember-me" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Ghi nhớ đăng nhập</label>
                </div>
                <a th:href="@{/forgot-password}" class="small text-muted">Quên mật khẩu?</a>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">Đăng nhập</button>
        </form>
        <div class="divider my-3"><span>hoặc</span></div>

        <a href="/oauth2/authorization/google"
           class="btn btn-outline-danger w-100 mb-2">
            <i class="fab fa-google me-2"></i> Đăng nhập với Google
        </a>

        <a href="/oauth2/authorization/facebook"
           class="btn btn-outline-primary w-100">
            <i class="fab fa-facebook me-2"></i> Đăng nhập với Facebook
        </a>

        <p class="text-center mt-3 mb-0">
            Chưa có tài khoản?
            <a th:href="@{/register}">Đăng ký ngay</a>
        </p>
    </div>
</div>
</body>
</html>
