<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="width: 460px">
        <h4 class="text-center mb-4">☕ Tạo tài khoản</h4>

        <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

        <form th:action="@{/register}" method="post" th:object="${registerDTO}">
            <div class="mb-3">
                <label class="form-label">Họ và tên</label>
                <input type="text" th:field="*{fullName}" class="form-control"
                       placeholder="Nguyễn Văn A">
                <div class="text-danger small" th:errors="*{fullName}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control"
                       placeholder="example@email.com">
                <div class="text-danger small" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" th:field="*{password}" class="form-control"
                       placeholder="Ít nhất 6 ký tự">
                <div class="text-danger small" th:errors="*{password}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Số điện thoại</label>
                <input type="text" th:field="*{phone}" class="form-control"
                       placeholder="0901234567">
                <div class="text-danger small" th:errors="*{phone}"></div>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">Đăng ký</button>
        </form>

        <p class="text-center mt-3 mb-0">
            Đã có tài khoản?
            <a th:href="@{/login}">Đăng nhập</a>
        </p>
    </div>
</div>
</body>
</html>
