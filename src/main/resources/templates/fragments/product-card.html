<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="card(p)" class="card h-100 border-0 shadow-sm product-card position-relative overflow-hidden">

    <!-- Badge SALE -->
    <span th:if="${p.salePrice != null and p.price != null and p.price > 0}"
          class="badge bg-danger position-absolute top-0 start-0 m-2 z-2">
        -<span th:text="${#numbers.formatDecimal((p.price - p.salePrice) / p.price * 100, 0, 'COMMA', 0, 'POINT')}"></span>%
    </span>

    <!-- Ảnh sản phẩm -->
    <a th:href="@{/products/{id}(id=${p.id})}" class="text-decoration-none">
        <div class="product-img-wrap">
            <img th:src="${p.thumbnail}" class="card-img-top product-img"
                 onerror="this.src='/images/default.png'" alt="product">
        </div>
    </a>

    <div class="card-body d-flex flex-column">
        <h6 class="card-title mb-1 product-name" th:text="${p.name}"></h6>

        <!-- Giá -->
        <div class="mt-auto mb-2">
            <span th:if="${p.salePrice != null}"
                  class="text-muted text-decoration-line-through small me-1"
                  th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">
            </span>
            <span class="fw-bold text-danger fs-5"
                  th:text="${#numbers.formatDecimal(p.displayPrice, 0, 'COMMA', 0, 'POINT')} + 'đ'">
            </span>
        </div>

        <!-- Nút hành động -->
        <div class="d-flex gap-2">
            <button type="button"
                    class="btn btn-outline-warning btn-sm flex-grow-1 quick-view-btn"
                    th:data-id="${p.id}"
                    title="Xem nhanh">
                <i class="bi bi-eye"></i>
            </button>
            <a th:href="@{/products/{id}(id=${p.id})}"
               class="btn btn-warning btn-sm flex-grow-1 fw-semibold">Xem chi tiết</a>
        </div>
    </div>
</div>
</body>
</html>
