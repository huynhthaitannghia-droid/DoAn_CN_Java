<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="card(p)" class="card h-100 shadow-sm position-relative product-card">

    <!-- Ảnh sản phẩm — click vẫn chuyển trang như cũ -->
    <a th:href="@{/products/{id}(id=${p.id})}">
        <img th:src="${p.thumbnail}" class="card-img-top"
             style="height:180px; object-fit:cover"
             onerror="this.src='/images/default.png'" alt="product">
    </a>

    <!-- Badge SALE -->
    <span th:if="${p.salePrice != null}"
          class="badge bg-danger position-absolute top-0 start-0 m-2">SALE</span>

    <div class="card-body d-flex flex-column">
        <h6 class="card-title" th:text="${p.name}"></h6>

        <!-- Giá -->
        <div class="mt-auto">
            <span th:if="${p.salePrice != null}"
                  class="text-muted text-decoration-line-through small me-1"
                  th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">
            </span>
            <span class="fw-bold text-danger"
                  th:text="${#numbers.formatDecimal(p.displayPrice, 0, 'COMMA', 0, 'POINT')} + 'đ'">
            </span>
        </div>

        <!-- Nút hành động -->
        <div class="d-flex gap-2 mt-2">
            <!-- Nút Quick View — gọi modal, KHÔNG chuyển trang -->
            <button type="button"
                    class="btn btn-outline-warning btn-sm flex-grow-1 quick-view-btn"
                    th:data-id="${p.id}"
                    title="Xem nhanh">
                🔍 Xem nhanh
            </button>

            <!-- Nút chi tiết đầy đủ -->
            <a th:href="@{/products/{id}(id=${p.id})}"
               class="btn btn-warning btn-sm flex-grow-1">Chi tiết</a>
        </div>
    </div>
</div>
</body>
</html>
