<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<!-- ══════════════════════════════════════════════════════════
     fragments/admin-layout.html
     Dùng: th:replace="~{fragments/admin-layout :: adminPage(~{::title}, ~{::main})}"
     ══════════════════════════════════════════════════════════ -->
<head th:fragment="adminHead">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        :root {
          --sidebar-w: 250px;
          --coffee: #6F4E37;
          --coffee-dark: #4a3424;
          --coffee-light: #c8a882;
          --accent: #e8a838;
          --sidebar-bg: #2c1810;
          --sidebar-text: #e8d5c0;
          --sidebar-hover: rgba(232,168,56,0.15);
          --sidebar-active: var(--accent);
        }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; }

        /* ── SIDEBAR ── */
        #sidebar {
          position: fixed; top: 0; left: 0;
          width: var(--sidebar-w); height: 100vh;
          background: var(--sidebar-bg);
          display: flex; flex-direction: column;
          z-index: 1000; transition: width .25s ease;
          overflow: hidden;
        }
        .sidebar-brand {
          padding: 1.25rem 1rem;
          border-bottom: 1px solid rgba(255,255,255,.08);
          display: flex; align-items: center; gap: .6rem;
        }
        .sidebar-brand .logo-icon {
          font-size: 1.6rem; color: var(--accent);
        }
        .sidebar-brand .logo-text {
          font-size: 1rem; font-weight: 700;
          color: #fff; white-space: nowrap;
          line-height: 1.2;
        }
        .sidebar-brand .logo-sub { font-size: .7rem; color: var(--coffee-light); }

        .sidebar-nav { flex: 1; overflow-y: auto; padding: .5rem 0; }
        .nav-section-label {
          font-size: .65rem; font-weight: 600; letter-spacing: .1em;
          text-transform: uppercase; color: rgba(232,213,192,.4);
          padding: 1rem 1.2rem .3rem;
        }
        .sidebar-nav .nav-link {
          display: flex; align-items: center; gap: .65rem;
          padding: .55rem 1.2rem;
          color: var(--sidebar-text);
          border-radius: 0; transition: background .15s, color .15s;
          font-size: .88rem; white-space: nowrap;
        }
        .sidebar-nav .nav-link i { font-size: 1rem; width: 1.2rem; text-align: center; }
        .sidebar-nav .nav-link:hover { background: var(--sidebar-hover); color: #fff; }
        .sidebar-nav .nav-link.active {
          background: var(--sidebar-hover);
          color: var(--accent);
          border-left: 3px solid var(--accent);
        }
        .sidebar-nav .badge-count {
          margin-left: auto;
          background: var(--accent); color: #2c1810;
          font-size: .65rem; font-weight: 700;
          padding: .15em .5em; border-radius: 999px;
        }

        /* ── TOPBAR ── */
        #topbar {
          position: fixed; top: 0;
          left: var(--sidebar-w); right: 0; height: 60px;
          background: #fff;
          border-bottom: 1px solid #e9ecef;
          display: flex; align-items: center;
          padding: 0 1.5rem; gap: 1rem;
          z-index: 999;
        }
        .topbar-title { font-weight: 600; font-size: 1rem; color: #2c3e50; }
        .topbar-right { margin-left: auto; display: flex; align-items: center; gap: .75rem; }
        .admin-avatar {
          width: 34px; height: 34px; border-radius: 50%;
          background: var(--coffee); color: #fff;
          display: flex; align-items: center; justify-content: center;
          font-size: .8rem; font-weight: 700;
        }

        /* ── MAIN CONTENT ── */
        #main-content {
          margin-left: var(--sidebar-w);
          margin-top: 60px;
          padding: 1.5rem;
          min-height: calc(100vh - 60px);
        }

        /* ── CARDS ── */
        .stat-card {
          border: none; border-radius: 12px;
          background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.06);
          padding: 1.25rem 1.5rem;
          display: flex; align-items: center; gap: 1rem;
        }
        .stat-icon {
          width: 48px; height: 48px; border-radius: 12px;
          display: flex; align-items: center; justify-content: center;
          font-size: 1.4rem;
        }
        .stat-label { font-size: .75rem; color: #6c757d; margin-bottom: .1rem; }
        .stat-value { font-size: 1.5rem; font-weight: 700; line-height: 1; }

        /* ── TABLE ── */
        .admin-table { background: #fff; border-radius: 12px;
                       box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: hidden; }
        .admin-table .table { margin: 0; }
        .admin-table .table thead th {
          background: #f8f9fa; font-size: .78rem;
          font-weight: 600; text-transform: uppercase;
          letter-spacing: .04em; color: #6c757d;
          border-bottom: 1px solid #e9ecef; white-space: nowrap;
        }
        .admin-table .table tbody tr:hover { background: #fafbff; }

        /* ── STATUS BADGES ── */
        .badge-PENDING    { background:#fff3cd; color:#856404; }
        .badge-PROCESSING { background:#cfe2ff; color:#084298; }
        .badge-SHIPPING   { background:#d1ecf1; color:#0c5460; }
        .badge-COMPLETED  { background:#d1e7dd; color:#0f5132; }
        .badge-CANCELLED  { background:#f8d7da; color:#842029; }

        /* ── ALERT ── */
        .toast-container { z-index: 9999; }

        /* Responsive */
        @media (max-width: 768px) {
          #sidebar { width: 0; }
          #topbar, #main-content { left: 0; margin-left: 0; }
        }
    </style>
</head>

<!-- ═══ SIDEBAR FRAGMENT ═══════════════════════════════════════════ -->
<nav th:fragment="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <span class="logo-icon"><i class="bi bi-cup-hot-fill"></i></span>
        <div>
            <div class="logo-text">Cafe Admin</div>
            <div class="logo-sub">Quản trị hệ thống</div>
        </div>
    </div>

    <div class="sidebar-nav">
        <div class="nav-section-label">Tổng quan</div>
        <a th:href="@{/admin/dashboard}"
           th:classappend="${#strings.contains(currentUri,'/dashboard') or
                         currentUri == '/admin' or
                         currentUri == '/admin/'} ? 'active' : ''"
           class="nav-link">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>

        <div class="nav-section-label">Kinh doanh</div>
        <a th:href="@{/admin/orders}"
           th:classappend="${#strings.contains(currentUri,'/admin/orders')} ? 'active' : ''"
           class="nav-link">
            <i class="bi bi-receipt"></i> Đơn hàng
            <span th:if="${pendingCount != null and pendingCount > 0}"
                  class="badge-count" th:text="${pendingCount}"></span>
        </a>

        <div class="nav-section-label">Danh mục</div>
        <a th:href="@{/admin/products}"
           th:classappend="${#strings.contains(currentUri,'/admin/products')} ? 'active' : ''"
           class="nav-link">
            <i class="bi bi-box-seam"></i> Sản phẩm
        </a>
        <a th:href="@{/admin/categories}"
           th:classappend="${#strings.contains(currentUri,'/admin/categories')} ? 'active' : ''"
           class="nav-link">
            <i class="bi bi-tags"></i> Danh mục
        </a>

        <div class="nav-section-label">Khách hàng</div>
        <a th:href="@{/admin/users}"
           th:classappend="${#strings.contains(currentUri,'/admin/users')} ? 'active' : ''"
           class="nav-link">
            <i class="bi bi-people"></i> Người dùng
        </a>

        <a th:href="@{/admin/reviews}"
           th:classappend="${#strings.contains(currentUri,'/admin/reviews')} ? 'active' : ''"
           class="nav-link">
            <i class="bi bi-star-half"></i> Đánh giá
        </a>

        <div class="nav-section-label">Hệ thống</div>
        <a th:href="@{/}" class="nav-link" target="_blank">
            <i class="bi bi-shop"></i> Xem trang web
        </a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="nav-link border-0 bg-transparent w-100 text-start text-danger">
                <i class="bi bi-box-arrow-left"></i> Đăng xuất
            </button>
        </form>
    </div>
</nav>

<!-- ═══ TOPBAR FRAGMENT ═════════════════════════════════════════════ -->
<header th:fragment="topbar(pageTitle)" id="topbar">
    <span class="topbar-title" th:text="${pageTitle}">Admin</span>
    <div class="topbar-right">
    <span class="text-muted" style="font-size:.82rem">
      <i class="bi bi-calendar3 me-1"></i>
      <span th:text="${#temporals.format(#temporals.createNow(),'dd/MM/yyyy')}"></span>
    </span>
        <div class="dropdown">
            <div class="admin-avatar dropdown-toggle" role="button"
                 data-bs-toggle="dropdown" style="cursor:pointer"
                 sec:authentication="name" th:text="${#strings.substring(#authentication.name,0,1)}">A</div>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><span class="dropdown-item-text small text-muted" sec:authentication="name"></span></li>
                <li><hr class="dropdown-divider"/></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="dropdown-item text-danger"><i class="bi bi-box-arrow-left me-1"></i>Đăng xuất</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>

<!-- ═══ TOAST FLASH MESSAGE ══════════════════════════════════════════ -->
<div th:fragment="flashMessages">
    <div th:if="${successMsg}" class="position-fixed bottom-0 end-0 p-3 toast-container">
        <div class="toast align-items-center text-bg-success border-0 show" role="alert">
            <div class="d-flex">
                <div class="toast-body"><i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
    <div th:if="${errorMsg}" class="position-fixed bottom-0 end-0 p-3 toast-container">
        <div class="toast align-items-center text-bg-danger border-0 show" role="alert">
            <div class="d-flex">
                <div class="toast-body"><i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
</div>
</html>
