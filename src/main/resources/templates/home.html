<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cafe & Trà Sữa</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* ── Quick View Modal ─────────────────────────────── */
        #quickViewModal .modal-dialog { max-width: 680px; }
        #quickViewModal .qv-img {
            width: 100%; height: 300px;
            object-fit: cover; border-radius: .5rem;
        }
        #quickViewModal .qv-price-original {
            font-size: .9rem; text-decoration: line-through; color: #aaa;
        }
        #quickViewModal .qv-price-main {
            font-size: 1.6rem; font-weight: 700; color: #dc3545;
        }
        #quickViewModal .qv-stock-ok  { color: #198754; font-weight: 600; }
        #quickViewModal .qv-stock-low { color: #dc3545; font-weight: 600; }
        .product-card { transition: box-shadow .2s; }
        .product-card:hover { box-shadow: 0 .5rem 1.2rem rgba(0,0,0,.15) !important; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Banner -->
<div class="bg-warning py-5 text-center">
    <h1 class="fw-bold">☕ Cafe & Trà Sữa</h1>
    <p class="lead">Thức uống thơm ngon — Giao tận nơi</p>
    <a th:href="@{/products}" class="btn btn-dark btn-lg">Xem thực đơn</a>
</div>

<!-- Danh mục -->
<div class="container my-5">
    <h4 class="fw-bold mb-3">Danh mục</h4>
    <div class="row g-3">
        <div class="col-6 col-md-3" th:each="cat : ${categories}">
            <a th:href="@{/products(categoryId=${cat.id})}"
               class="card text-center text-decoration-none h-100 shadow-sm">
                <div class="card-body">
                    <p class="fw-bold mb-0" th:text="${cat.name}"></p>
                </div>
            </a>
        </div>
    </div>
</div>

<!-- Sản phẩm nổi bật -->
<div class="container my-5" th:if="${!featuredProducts.isEmpty()}">
    <h4 class="fw-bold mb-3">⭐ Nổi bật</h4>
    <div class="row g-3">
        <div class="col-6 col-md-3" th:each="p : ${featuredProducts}">
            <div th:replace="~{fragments/product-card :: card(${p})}"></div>
        </div>
    </div>
</div>

<!-- Đang giảm giá -->
<div class="container my-5" th:if="${!saleProducts.isEmpty()}">
    <h4 class="fw-bold mb-3">🔥 Đang giảm giá</h4>
    <div class="row g-3">
        <div class="col-6 col-md-3" th:each="p : ${saleProducts}">
            <div th:replace="~{fragments/product-card :: card(${p})}"></div>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════════
     MODAL QUICK VIEW  (dùng chung script với list.html)
     ══════════════════════════════════════════════════ -->
<div class="modal fade" id="quickViewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="qvTitle">Đang tải...</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-2">
                <div id="qvSpinner" class="text-center py-4">
                    <div class="spinner-border text-warning" role="status"></div>
                    <p class="mt-2 text-muted small">Đang tải thông tin...</p>
                </div>
                <div id="qvContent" class="row g-3">
                    <div class="col-5">
                        <img id="qvImg" src="" alt="product" class="qv-img">
                    </div>
                    <div class="col-7 d-flex flex-column">
                        <span id="qvCategory" class="badge bg-warning text-dark mb-2 align-self-start"></span>
                        <div class="mb-2">
                            <span id="qvPriceOriginal" class="qv-price-original me-1"></span>
                            <span id="qvPrice" class="qv-price-main"></span>
                            <span id="qvSaleBadge" class="badge bg-danger ms-1 d-none">SALE</span>
                        </div>
                        <p id="qvDesc" class="text-secondary small flex-grow-1"
                           style="max-height:120px; overflow-y:auto"></p>
                        <p class="mb-3">Tồn kho: <span id="qvStock"></span></p>
                        <div class="d-flex gap-2">
                            <a id="qvDetailLink" href="#" class="btn btn-warning fw-bold flex-grow-1">Xem chi tiết</a>
                            <a id="qvCartLink"   href="#" class="btn btn-outline-dark flex-grow-1">🛒 Thêm vào giỏ</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const fmt = n => new Intl.NumberFormat('vi-VN').format(n) + 'đ';
    const $   = id => document.getElementById(id);
    const modal = new bootstrap.Modal(document.getElementById('quickViewModal'));

    function showSpinner() {
        $('qvSpinner').style.display = 'block';
        $('qvContent').style.display = 'none';
    }
    function hideSpinner() {
        $('qvSpinner').style.display = 'none';
        $('qvContent').style.display = 'flex';
    }

    async function openQuickView(productId) {
        showSpinner();
        $('qvTitle').textContent = 'Xem nhanh';
        modal.show();
        try {
            const res = await fetch(`/api/products/${productId}/quickview`);
            if (!res.ok) throw new Error('Không tải được sản phẩm');
            const p = await res.json();

            $('qvTitle').textContent    = p.name;
            $('qvImg').src              = p.thumbnail || '/images/default.png';
            $('qvImg').onerror          = () => { $('qvImg').src = '/images/default.png'; };
            $('qvDesc').textContent     = p.description || 'Không có mô tả.';
            $('qvCategory').textContent = p.category || '';
            $('qvPrice').textContent    = fmt(p.displayPrice);

            if (p.salePrice) {
                $('qvPriceOriginal').textContent = fmt(p.price);
                $('qvSaleBadge').classList.remove('d-none');
            } else {
                $('qvPriceOriginal').textContent = '';
                $('qvSaleBadge').classList.add('d-none');
            }

            const stockEl = $('qvStock');
            stockEl.textContent = p.stock > 0 ? `${p.stock} sản phẩm` : 'Hết hàng';
            stockEl.className   = p.stock > 0
                ? (p.stock < 5 ? 'qv-stock-low' : 'qv-stock-ok')
                : 'qv-stock-low';

            $('qvDetailLink').href = `/products/${p.id}`;
            if (p.stock > 0) {
                $('qvCartLink').href = `/products/${p.id}#add-to-cart`;
                $('qvCartLink').classList.remove('disabled');
                $('qvCartLink').textContent = '🛒 Thêm vào giỏ';
            } else {
                $('qvCartLink').href = '#';
                $('qvCartLink').classList.add('disabled');
                $('qvCartLink').textContent = 'Hết hàng';
            }
            hideSpinner();
        } catch (err) {
            $('qvTitle').textContent = 'Lỗi';
            $('qvSpinner').innerHTML = `<p class="text-danger py-3">⚠️ ${err.message}</p>`;
            $('qvSpinner').style.display = 'block';
        }
    }

    document.addEventListener('click', e => {
        const btn = e.target.closest('.quick-view-btn');
        if (btn) openQuickView(btn.dataset.id);
    });
</script>
</body>
</html>
