<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Chi tiết sản phẩm</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">
    <div class="row g-4">

        <!-- Ảnh sản phẩm -->
        <div class="col-md-5">
            <img th:src="${product.thumbnail}"
                 class="img-fluid rounded shadow"
                 style="width:100%; height:380px; object-fit:cover"
                 onerror="this.src='/images/default.png'"
                 alt="product">

            <!-- Ảnh phụ -->
            <div class="d-flex gap-2 mt-2 flex-wrap">
                <img th:each="img : ${product.images}"
                     th:src="${img.imagePath}"
                     class="rounded border"
                     style="width:70px; height:70px; object-fit:cover; cursor:pointer"
                     onclick="document.querySelector('.img-fluid').src=this.src"
                     alt="sub">
            </div>
        </div>

        <!-- Thông tin sản phẩm -->
        <div class="col-md-7">
            <h2 th:text="${product.name}"></h2>

            <!-- Giá -->
            <div class="my-3">
                <span th:if="${product.salePrice != null}"
                      class="text-muted text-decoration-line-through me-2 fs-5"
                      th:text="${#numbers.formatDecimal(product.price,0,'COMMA',0,'POINT')} + 'đ'">
                </span>
                <span class="text-danger fw-bold fs-3"
                      th:text="${#numbers.formatDecimal(product.displayPrice,0,'COMMA',0,'POINT')} + 'đ'">
                </span>
                <span th:if="${product.salePrice != null}"
                      class="badge bg-danger ms-2">SALE</span>
            </div>

            <!-- Tồn kho -->
            <p class="text-muted">
                Còn lại:
                <span th:text="${product.stock}"
                      th:classappend="${product.stock < 5} ? 'text-danger fw-bold' : 'text-success fw-bold'">
                </span> sản phẩm
            </p>

            <!-- Mô tả -->
            <p th:text="${product.description}" class="text-secondary"></p>

            <!-- Thêm vào giỏ -->
            <form th:action="@{/cart/add}" method="post"
                  th:if="${product.stock > 0}">
                <input type="hidden" name="productId" th:value="${product.id}">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <label class="fw-bold">Số lượng:</label>
                    <div class="input-group" style="width:140px">
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="changeQty(-1)">−</button>
                        <input type="number" name="quantity" id="qty"
                               value="1" min="1"
                               th:max="${product.stock}"
                               class="form-control text-center">
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="changeQty(1)">+</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-warning btn-lg px-5 fw-bold">
                    🛒 Thêm vào giỏ
                </button>
            </form>

            <div th:if="${product.stock == 0}"
                 class="alert alert-danger mt-3">Hết hàng</div>

            <!-- Toast thành công -->
            <div th:if="${toast}" class="alert alert-success mt-3"
                 th:text="${toast}"></div>
            <div th:if="${toastError}" class="alert alert-danger mt-3"
                 th:text="${toastError}"></div>
        </div>
    </div>

    <!-- Đánh giá -->
    <div class="mt-5">
        <h5 class="fw-bold mb-3">⭐ Đánh giá sản phẩm</h5>
        <div th:if="${product.reviews.isEmpty()}"
             class="text-muted">Chưa có đánh giá nào.</div>
        <div th:each="review : ${product.reviews}"
             th:if="${review.approved}"
             class="card mb-2 p-3">
            <div class="d-flex justify-content-between">
                <strong th:text="${review.user.fullName}"></strong>
                <span class="text-warning"
                      th:text="${'★'.repeat(review.rating)}"></span>
            </div>
            <p class="mb-0 text-secondary" th:text="${review.comment}"></p>
        </div>
    </div>
</div>

<script>
    function changeQty(delta) {
        const input = document.getElementById('qty');
        const max = parseInt(input.max);
        let val = parseInt(input.value) + delta;
        if (val < 1) val = 1;
        if (val > max) val = max;
        input.value = val;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
